<header class="site-header">
  <div class="container">
    <h1 class="site-title">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </h1>
    <nav class="site-nav">
      <ul>
        {% for item in site.nav %}
        <li>
          <a href="{{ item.link | relative_url }}">{{ item.name }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
